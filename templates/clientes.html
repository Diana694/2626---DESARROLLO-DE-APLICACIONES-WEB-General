{% extends "base.html" %}
{% block title %}Clientes - Panadería Aquí Me Voy{% endblock %}

{% block content %}
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Gestión de Clientes</h1>
        <a href="{{ url_for('formulario_cliente') }}" class="btn btn-success">+ Nuevo Cliente</a>
    </div>

    <table class="table table-striped table-hover border align-middle">
        <thead class="table-dark">
            <tr>
                <th>Nombre</th>
                <th>Teléfono</th>
                <th>Tipo</th>
            </tr>
        </thead>
        <tbody>
            {% for cliente in clientes %}
            <tr>
                <td>{{ cliente.nombre }}</td>
                <td>{{ cliente.telefono }}</td>
                <td><span class="badge bg-info text-dark">{{ cliente.tipo }}</span></td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
{% endblock %}
